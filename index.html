<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Денежный Кликер Онлайн</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 12px;
      overflow-x: hidden;
    }
    .header {
      background: #1e1e1e;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .balance {
      font-size: 38px;
      font-weight: 900;
      color: #2ecc71;
    }
    .stats {
      color: #aaa;
      font-size: 14px;
      margin-top: 4px;
    }
    .user-badge {
      font-size: 12px;
      color: #f1c40f;
      margin-top: 5px;
    }

    /* Вкладки меню */
    .tabs {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .tab-btn {
      background: #252525;
      color: #aaa;
      border: 1px solid #333;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      max-width: 115px;
    }
    .tab-btn.active {
      background: #2ecc71;
      color: #121212;
      border-color: #2ecc71;
    }

    .section {
      display: none;
    }
    .section.active {
      display: block;
    }

    /* Кнопка клика */
    .click-area {
      position: relative;
      margin: 15px 0 25px 0;
      display: inline-block;
    }
    .click-btn {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      background: radial-gradient(circle, #2ecc71, #27ae60);
      border: 6px solid #1e8449;
      color: white;
      font-size: 60px;
      box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s;
    }
    .click-btn:active, .click-btn.pop {
      transform: scale(0.9);
    }

    /* Анимация вылетающего доллара */
    .floating-dollar {
      position: absolute;
      font-size: 22px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 999;
      animation: floatUp 0.7s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
      100% { opacity: 0; transform: translate(-50%, -75px) scale(1.15); }
    }

    /* Магазин */
    .shop-box {
      max-width: 420px;
      margin: 0 auto;
      text-align: left;
    }
    .shop-title {
      text-align: center;
      color: #f1c40f;
      margin: 5px 0 12px 0;
      font-size: 18px;
    }
    .upgrade-btn {
      width: 100%;
      background-color: #1f1f1f;
      border: 2px solid #333;
      color: white;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .upgrade-btn:active {
      background-color: #2c2c2c;
    }
    .price {
      background: #2c2c2c;
      color: #f1c40f;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* Рейтинг реальных игроков */
    .leaderboard-box {
      max-width: 420px;
      margin: 0 auto;
      background: #1b1b1b;
      border-radius: 14px;
      border: 1px solid #333;
      overflow: hidden;
    }
    .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 14px;
    }
    .leader-row.me {
      background: rgba(46, 204, 113, 0.2);
      border-left: 4px solid #2ecc71;
      font-weight: bold;
    }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      margin-right: 5px;
    }

    /* Профиль */
    .profile-box {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      max-width: 380px;
      margin: 0 auto;
    }
    .input-field {
      width: 100%;
      background: #121212;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 10px;
    }
    .save-btn {
      width: 100%;
      background: #2ecc71;
      border: none;
      color: #000;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .footer-version {
      margin-top: 25px;
      color: #666;
      font-size: 13px;
      padding-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель баланса -->
  <div class="header">
    <div class="balance">$<span id="money">0</span></div>
    <div class="stats">
      За клик: <b>$<span id="clickPower">1</span></b> | В сек: <b>$<span id="autoIncome">0</span></b>
    </div>
    <div class="user-badge">👤 <span id="playerName">Игрок</span></div>
  </div>

  <!-- Навигация по вкладкам -->
  <div class="tabs">
    <button id="btn-game" class="tab-btn active" onclick="openTab('game')">🎮 Кликер</button>
    <button id="btn-top" class="tab-btn" onclick="openTab('top')"><span class="live-dot"></span>Рейтинг</button>
    <button id="btn-prof" class="tab-btn" onclick="openTab('prof')">⚙️ Никнейм</button>
  </div>

  <!-- ВКЛАДКА 1: КЛИКЕР + МАГАЗИН -->
  <div id="sec-game" class="section active">
    <div class="click-area" id="clickArea">
      <button class="click-btn" id="mainBtn" onclick="tapCoin(event)">💵</button>
    </div>

    <div class="shop-box">
      <div class="shop-title">🛒 Магазин прокачки</div>

      <button class="upgrade-btn" onclick="buyItem(0)">
        <div>
          <div style="font-weight:bold;">💪 Сила клика (Ур. <span id="cnt0">0</span>)</div>
          <div style="font-size:12px; color:#888;">+1$ к клику</div>
        </div>
        <div class="price">$<span id="cost0">15</span></div>
      </button>

      <button class="upgrade-btn" onclick="buyItem(1)">
        <div>
          <div style="font-weight:bold;">🥤 Лимонадный киоск (Ур. <span id="cnt1">0</span>)</div>
          <div style="font-size:12px; color:#888;">+2$ в секунду</div>
        </div>
        <div class="price">$<span id="cost1">50</span></div>
      </button>

      <button class="upgrade-btn" onclick="buyItem(2)">
        <div>
          <div style="font-weight:bold;">💎 Золотой палец (Ур. <span id="cnt2">0</span>)</div>
          <div style="font-size:12px; color:#888;">+5$ к клику</div>
        </div>
        <div class="price">$<span id="cost2">250</span></div>
      </button>

      <button class="upgrade-btn" onclick="buyItem(3)">
        <div>
          <div style="font-weight:bold;">🏪 Супермаркет (Ур. <span id="cnt3">0</span>)</div>
          <div style="font-size:12px; color:#888;">+15$ в секунду</div>
        </div>
        <div class="price">$<span id="cost3">1000</span></div>
      </button>

      <button class="upgrade-btn" onclick="buyItem(4)">
        <div>
          <div style="font-weight:bold;">🏦 Крипто-Банк (Ур. <span id="cnt4">0</span>)</div>
          <div style="font-size:12px; color:#888;">+100$ в секунду</div>
        </div>
        <div class="price">$<span id="cost4">8000</span></div>
      </button>
    </div>
  </div>

  <!-- ВКЛАДКА 2: РЕЙТИНГ РЕАЛЬНЫХ ИГРОКОВ -->
  <div id="sec-top" class="section">
    <div class="shop-title">🏆 Живой рейтинг игроков</div>
    <div class="leaderboard-box" id="topList">
      <div style="padding:15px; color:#888;">Загрузка игроков...</div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: ПРОФИЛЬ -->
  <div id="sec-prof" class="section">
    <div class="profile-box">
      <h3 style="margin-top:0;">Ваш ник для рейтинга</h3>
      <input type="text" id="nickInput" class="input-field" placeholder="Введите ваш ник..." maxlength="14">
      <button class="save-btn" onclick="saveNick()">Сохранить</button>
    </div>
  </div>

  <div class="footer-version">
    бета тестирование версия 1.1
  </div>

  <script>
    var FIREBASE_URL = "https://clicker-8ad8b-default-rtdb.firebaseio.com";

    var playerId = localStorage.getItem('m_uid');
    if (!playerId) {
      playerId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('m_uid', playerId);
    }

    var money = Number(localStorage.getItem('m_money')) || 0;
    var clickPower = Number(localStorage.getItem('m_click')) || 1;
    var autoIncome = Number(localStorage.getItem('m_auto')) || 0;
    var playerName = localStorage.getItem('m_name') || ("Игрок_" + Math.floor(Math.random() * 899 + 100));

    var costs = [15, 50, 250, 1000, 8000];
    var counts = [0, 0, 0, 0, 0];
    var powers = [1, 2, 5, 15, 100];
    var types = ['click', 'auto', 'click', 'auto', 'auto'];

    for (var i = 0; i < 5; i++) {
      var sc = Number(localStorage.getItem('m_cost' + i));
      var sct = Number(localStorage.getItem('m_cnt' + i));
      if (sc > 0) costs[i] = sc;
      if (sct > 0) counts[i] = sct;
    }

    var mainBtn = document.getElementById('mainBtn');

    // Мгновенный отклик на телефоне без зума
    mainBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      tapCoin();
    }, { passive: false });

    function tapCoin(e) {
      money += clickPower;
      
      mainBtn.classList.add('pop');
      setTimeout(function() { mainBtn.classList.remove('pop'); }, 60);

      spawnDollar();
      refreshScreen();
      syncWithServer();
    }

    function spawnDollar() {
      var area = document.getElementById('clickArea');
      var el = document.createElement('div');
      el.className = 'floating-dollar';
      el.innerHTML = '+$' + clickPower + ' 💵';
      var offset = Math.floor(Math.random() * 60) - 30;
      el.style.left = (82 + offset) + 'px';
      el.style.top = '40px';
      area.appendChild(el);
      setTimeout(function() { el.remove(); }, 700);
    }

    function buyItem(idx) {
      if (money >= costs[idx]) {
        money -= costs[idx];
        counts[idx] += 1;
        if (types[idx] === 'click') {
          clickPower += powers[idx];
        } else {
          autoIncome += powers[idx];
        }
        costs[idx] = Math.round(costs[idx] * 1.55);
        refreshScreen();
        syncWithServer();
      }
    }

    function openTab(tab) {
      document.getElementById('sec-game').className = 'section';
      document.getElementById('sec-top').className = 'section';
      document.getElementById('sec-prof').className = 'section';

      document.getElementById('btn-game').className = 'tab-btn';
      document.getElementById('btn-top').className = 'tab-btn';
      document.getElementById('btn-prof').className = 'tab-btn';

      document.getElementById('sec-' + tab).className = 'section active';
      document.getElementById('btn-' + tab).className = 'tab-btn active';

      if (tab === 'top') loadRealPlayers();
    }

    function saveNick() {
      var val = document.getElementById('nickInput').value.trim();
      if (val.length > 0) {
        playerName = val;
        localStorage.setItem('m_name', playerName);
        refreshScreen();
        syncWithServer();
        alert('Никнейм сохранен! Теперь все видят вас в рейтинге под этим именем.');
      }
    }

    function syncWithServer() {
      fetch(FIREBASE_URL + '/players/' + playerId + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: playerName,
          money: Math.floor(money),
          updated: Date.now()
        })
      }).catch(function() {});
    }

    function loadRealPlayers() {
      var box = document.getElementById('topList');
      fetch(FIREBASE_URL + '/players.json')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!data || data.error) {
            box.innerHTML = '<div style="padding:15px; color:#f1c40f;">В базе пока пусто или доступ закрыт в правилах (Rules). Кликните по кнопке пару раз!</div>';
            return;
          }
          var list = [];
          for (var key in data) {
            if (data[key] && typeof data[key].money === 'number') {
              list.push({
                id: key,
                name: data[key].name || 'Аноним',
                money: data[key].money
              });
            }
          }
          list.sort(function(a, b) { return b.money - a.money; });

          var html = '';
          for (var i = 0; i < list.length; i++) {
            var isMe = (list[i].id === playerId);
            var rowClass = isMe ? 'leader-row me' : 'leader-row';
            var tag = isMe ? ' (Вы)' : '';
            html += '<div class="' + rowClass + '"><span>#' + (i + 1) + ' ' + list[i].name + tag + '</span><span>$' + Math.floor(list[i].money) + '</span></div>';
          }
          box.innerHTML = html;
        })
        .catch(function() {
          box.innerHTML = '<div style="padding:15px; color:#e74c3c;">Ошибка подключения к базе</div>';
        });
    }

    function refreshScreen() {
      document.getElementById('money').innerHTML = Math.floor(money);
      document.getElementById('clickPower').innerHTML = clickPower;
      document.getElementById('autoIncome').innerHTML = autoIncome;
      document.getElementById('playerName').innerHTML = playerName;

      for (var i = 0; i < 5; i++) {
        document.getElementById('cost' + i).innerHTML = costs[i];
        document.getElementById('cnt' + i).innerHTML = counts[i];
        localStorage.setItem('m_cost' + i, costs[i]);
        localStorage.setItem('m_cnt' + i, counts[i]);
      }

      localStorage.setItem('m_money', money);
      localStorage.setItem('m_click', clickPower);
      localStorage.setItem('m_auto', autoIncome);
    }

    setInterval(function() {
      if (autoIncome > 0) {
        money += autoIncome;
        refreshScreen();
      }
      syncWithServer();
      if (document.getElementById('sec-top').className.indexOf('active') !== -1) {
        loadRealPlayers();
      }
    }, 1500);

    refreshScreen();
    syncWithServer();
  </script>
</body>
</html>
