<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Денежный Кликер Онлайн</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 15px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .balance {
      font-size: 38px;
      font-weight: 900;
      color: #2ecc71;
    }
    .stats {
      color: #aaa;
      font-size: 14px;
      margin-top: 5px;
    }
    .user-badge {
      font-size: 12px;
      color: #f1c40f;
      margin-top: 5px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: #252525;
      color: #888;
      border: 1px solid #333;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2ecc71;
      color: #121212;
      border-color: #2ecc71;
    }

    .view-panel {
      display: none;
      flex: 1;
    }
    .view-panel.active {
      display: block;
    }

    .click-area {
      position: relative;
      margin: 25px 0;
      display: inline-block;
    }
    .click-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, #2ecc71, #27ae60);
      border: 6px solid #1e8449;
      color: white;
      font-size: 64px;
      box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s ease;
    }
    .click-btn.active-pop {
      transform: scale(0.9);
    }

    .floating-dollar {
      position: absolute;
      font-size: 24px;
      font-weight: 900;
      color: #2ecc71;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 100;
      animation: floatDollar 0.8s ease-out forwards;
    }
    @keyframes floatDollar {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.8) translateY(0);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2) translateY(-40px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1) translateY(-80px);
      }
    }

    .shop {
      max-width: 420px;
      margin: 0 auto;
      text-align: left;
    }
    .upgrade-btn {
      width: 100%;
      background-color: #1f1f1f;
      border: 2px solid #333;
      color: white;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .price {
      background: #2c2c2c;
      color: #f1c40f;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .can-buy {
      border-color: #2ecc71;
    }

    .leaderboard-box {
      max-width: 420px;
      margin: 0 auto;
      background: #1b1b1b;
      border-radius: 14px;
      border: 1px solid #333;
      overflow: hidden;
    }
    .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 14px;
    }
    .leader-row.me {
      background: rgba(46, 204, 113, 0.15);
      border-left: 3px solid #2ecc71;
      font-weight: bold;
    }
    .leader-row:first-child {
      color: #f1c40f;
    }

    .auth-box {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      max-width: 380px;
      margin: 0 auto 20px auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .auth-input {
      background: #121212;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    .auth-submit-btn {
      background: #2ecc71;
      border: none;
      color: #000;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .footer-version {
      margin-top: 30px;
      color: #666;
      font-size: 13px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="balance">$<span id="money">0</span></div>
    <div class="stats">
      За клик: <b>$<span id="clickPower">1</span></b> | В сек: <b>$<span id="autoIncome">0</span></b>
    </div>
    <div class="user-badge">👤 <span id="playerNameBadge">Игрок</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('game', this)">🎮 Игра</button>
    <button class="tab-btn" onclick="switchTab('leaderboard', this)">🏆 Рейтинг</button>
    <button class="tab-btn" onclick="switchTab('profile', this)">⚙️ Профиль</button>
  </div>

  <!-- Вкладка: Игра -->
  <div id="view-game" class="view-panel active">
    <div class="click-area" id="clickArea">
      <button class="click-btn" id="mainBtn">💵</button>
    </div>

    <div class="shop">
      <h3 style="color:#f1c40f; text-align:center;">🛒 Магазин</h3>
      <div id="shopContainer"></div>
    </div>
  </div>

  <!-- Вкладка: Рейтинг -->
  <div id="view-leaderboard" class="view-panel">
    <h3 style="color:#f1c40f;">🏆 Топ игроков</h3>
    <div class="leaderboard-box" id="leaderboardList"></div>
  </div>

  <!-- Вкладка: Профиль -->
  <div id="view-profile" class="view-panel">
    <div class="auth-box">
      <h3>Ваш игровой ник</h3>
      <input type="text" id="nameInput" class="auth-input" placeholder="Введите имя..." maxlength="12">
      <button class="auth-submit-btn" onclick="setNickname()">Сохранить ник</button>
    </div>
  </div>

  <div class="footer-version">
    бета тестирование версия 1.2
  </div>

    let state = JSON.parse(localStorage.getItem('clickerSave')) || {
      name: "Игрок
